<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物单游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
            background-color: #c8e6c9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            transform: scale(0.95);
            transform-origin: top center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            gap: 15px;
            flex-shrink: 0;
        }

        .cart-icon {
            width: 70px;
            height: 70px;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #000000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background-color: #9c27b0;
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            background-color: #7b1fa2;
            transform: rotate(30deg);
        }

        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 15px 35px;
            max-width: 1400px;
            width: 100%;
            flex: 1;
            align-content: center;
        }

        .product-card {
            background-color: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 270px;
        }

        .image-wrapper {
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #ffffff;
            border-radius: 10px;
        }

        .product-image {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
            transition: all 0.3s;
        }

        .product-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            text-align: center;
            flex-shrink: 0;
            transition: font-size 0.3s;
        }

        .button-container {
            display: flex;
            gap: 6px;
            margin-top: auto;
            padding-top: 5px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            min-width: 115px;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-listen {
            background-color: #2196f3;
        }

        .btn-record {
            background-color: #f44336;
        }

        .btn-recording {
            background-color: #ff9800 !important;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* 设置弹窗 */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-content {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            animation: popIn 0.3s ease-out;
        }

        .settings-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff9800;
        }

        .settings-section {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 10px;
        }

        .settings-section h3 {
            font-size: 20px;
            color: #ff9800;
            margin-bottom: 15px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .setting-row label {
            min-width: 100px;
            font-size: 16px;
            color: #333;
        }

        .setting-row input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 4px;
        }

        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #ff9800;
            border-radius: 50%;
            cursor: pointer;
        }

        .setting-row input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
        }

        .setting-row input[type="file"] {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .setting-row select {
            flex: 1;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
        }

        .setting-value {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            color: #ff9800;
        }

        .setting-card-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .card-option {
            padding: 10px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }

        .card-option:hover {
            border-color: #ff9800;
        }

        .card-option.active {
            border-color: #ff9800;
            background-color: #fff3e0;
        }

        .close-settings {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .close-settings:hover {
            background-color: #43a047;
        }

        /* 奖励弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .modal-content {
            background-color: white;
            border-radius: 25px;
            padding: 50px 60px;
            text-align: center;
            animation: popIn 0.3s ease-out;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .thumbs-up-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-text {
            font-size: 52px;
            font-weight: bold;
            color: #000000;
        }

        @media (max-width: 1200px) {
            .game-container { gap: 15px; padding: 15px 20px; }
            .image-wrapper { width: 100px; height: 100px; }
            .product-image { max-width: 90px; max-height: 90px; }
            .product-name { font-size: 20px; }
            .btn { min-width: 100px; height: 45px; font-size: 16px; }
            .title { font-size: 36px; }
            .cart-icon { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <svg class="cart-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="80" r="8" fill="#333" stroke="#333" stroke-width="2"/>
            <circle cx="70" cy="80" r="8" fill="#333" stroke="#333" stroke-width="2"/>
            <path d="M10 20 L20 20 L25 60 L75 60 L85 25 L35 25" stroke="#333" stroke-width="4" fill="#ffcc80" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M35 25 L40 10 L60 10 L65 25" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="35" cy="40" r="5" fill="#ff5722"/>
            <circle cx="55" cy="45" r="5" fill="#4caf50"/>
            <circle cx="45" cy="50" r="5" fill="#2196f3"/>
        </svg>
        <h1 class="title">购物单</h1>
    </div>

    <!-- 设置按钮 -->
    <button class="settings-btn" onclick="openSettings()">⚙</button>

    <div class="game-container" id="gameContainer">
        <!-- 商品卡片由JS动态生成 -->
    </div>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="settings-modal">
        <div class="settings-content">
            <div class="settings-title">⚙ 设置中心</div>
            
            <!-- 图片设置 -->
            <div class="settings-section">
                <h3>🖼️ 图片设置</h3>
                <div class="setting-row">
                    <label>选择商品:</label>
                    <select id="imageProductSelect" onchange="loadProductSettings()">
                        <option value="0">饼干</option>
                        <option value="1">洗手液</option>
                        <option value="2">可乐</option>
                        <option value="3">纸巾</option>
                        <option value="4">薯片</option>
                        <option value="5">紫菜</option>
                        <option value="6">棒棒糖</option>
                        <option value="7">葡萄干</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>更换图片:</label>
                    <input type="file" id="imageFile" accept="image/*" onchange="previewNewImage(event)">
                </div>
                <div class="setting-row">
                    <label>图片大小:</label>
                    <input type="range" id="imageSize" min="50" max="150" value="120" oninput="updateImageSize(this.value)">
                    <span class="setting-value" id="imageSizeValue">120px</span>
                </div>
            </div>

            <!-- 语音设置 -->
            <div class="settings-section">
                <h3>🔊 语音设置</h3>
                <div class="setting-row">
                    <label>语速:</label>
                    <input type="range" id="speechRate" min="0.3" max="1" step="0.1" value="0.5" oninput="updateSpeechRate(this.value)">
                    <span class="setting-value" id="speechRateValue">0.5x</span>
                </div>
                <div class="setting-row">
                    <label>音量:</label>
                    <input type="range" id="speechVolume" min="0" max="1" step="0.1" value="1" oninput="updateSpeechVolume(this.value)">
                    <span class="setting-value" id="speechVolumeValue">100%</span>
                </div>
                <div class="setting-row">
                    <label>自定义语音:</label>
                    <input type="text" id="customSpeech" placeholder="留空使用默认商品名称">
                </div>
            </div>

            <!-- 文字设置 -->
            <div class="settings-section">
                <h3>📝 文字设置</h3>
                <div class="setting-row">
                    <label>文字大小:</label>
                    <input type="range" id="textSize" min="14" max="36" value="22" oninput="updateTextSize(this.value)">
                    <span class="setting-value" id="textSizeValue">22px</span>
                </div>
                <div class="setting-row">
                    <label>商品名称:</label>
                    <input type="text" id="customName" placeholder="修改商品名称" oninput="updateProductName(this.value)">
                </div>
            </div>

            <button class="close-settings" onclick="closeSettings()">✓ 保存并关闭</button>
        </div>
    </div>

    <!-- 奖励弹窗 -->
    <div id="rewardModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="thumbs-up-container">
                <span style="font-size: 160px; line-height: 1;">👍</span>
            </div>
            <div class="modal-text">你真棒！</div>
        </div>
    </div>

    <script>
        // 商品数据
        const products = [
            { name: '饼干', image: 'shoppingpicture/biscuit.png' },
            { name: '洗手液', image: 'shoppingpicture/hand_sanitizer.png' },
            { name: '可乐', image: 'shoppingpicture/cola.png' },
            { name: '纸巾', image: 'shoppingpicture/tissue.png' },
            { name: '薯片', image: 'shoppingpicture/chips.png' },
            { name: '紫菜', image: 'shoppingpicture/seaweed.png' },
            { name: '棒棒糖', image: 'shoppingpicture/lollipop.png' },
            { name: '葡萄干', image: 'shoppingpicture/raisin.png' }
        ];

        // 可设置的参数
        let settings = {
            speechRate: 0.5,
            speechVolume: 1,
            textSize: 22,
            imageSize: 120,
            customNames: [...products.map(p => p.name)],
            customImages: [...products.map(p => p.image)],
            customSpeech: ['', '', '', '', '', '', '', '']
        };

        let currentEditIndex = 0;
        let modalTimeout;

        // 初始化游戏
        function initGame() {
            renderProducts();
        }

        // 渲染商品卡片
        function renderProducts() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = '';
            
            products.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img class="product-image" id="productImage${index}" 
                             src="${settings.customImages[index]}" 
                             alt="${settings.customNames[index]}"
                             style="max-width: ${settings.imageSize}px; max-height: ${settings.imageSize}px;">
                    </div>
                    <div class="product-name" id="productName${index}" 
                         style="font-size: ${settings.textSize}px;">
                        ${settings.customNames[index]}
                    </div>
                    <div class="button-container">
                        <button class="btn btn-listen" onclick="speakProduct(${index})">🔊 听一听</button>
                        <button class="btn btn-record" onclick="toggleRecord(this, ${index})">🎤 录一录</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 语音朗读功能
        function speakProduct(index) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const text = settings.customSpeech[index] || settings.customNames[index];
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = settings.speechRate;
                utterance.volume = settings.speechVolume;
                utterance.pitch = 1;
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // 朗读指定文字
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = settings.speechRate;
                utterance.volume = settings.speechVolume;
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 录音切换功能
        function toggleRecord(button, index) {
            const isRecording = button.classList.contains('btn-recording');
            if (!isRecording) {
                button.classList.add('btn-recording');
                button.innerHTML = '⏹️ 结束录音';
            } else {
                button.classList.remove('btn-recording');
                button.innerHTML = '🎤 录一录';
                showRewardModal();
            }
        }

        // 显示奖励弹窗
        function showRewardModal() {
            const modal = document.getElementById('rewardModal');
            modal.style.display = 'flex';
            speakText('你真棒！');
            if (modalTimeout) clearTimeout(modalTimeout);
            modalTimeout = setTimeout(() => modal.style.display = 'none', 2000);
        }

        // 关闭奖励弹窗
        function closeModal() {
            const modal = document.getElementById('rewardModal');
            modal.style.display = 'none';
            if (modalTimeout) clearTimeout(modalTimeout);
        }

        // 打开设置
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            loadProductSettings();
        }

        // 关闭设置
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
            renderProducts();
        }

        // 加载商品设置
        function loadProductSettings() {
            const index = parseInt(document.getElementById('imageProductSelect').value);
            currentEditIndex = index;
            
            document.getElementById('imageSize').value = settings.imageSize;
            document.getElementById('imageSizeValue').textContent = settings.imageSize + 'px';
            
            document.getElementById('textSize').value = settings.textSize;
            document.getElementById('textSizeValue').textContent = settings.textSize + 'px';
            
            document.getElementById('customName').value = settings.customNames[index];
            document.getElementById('customSpeech').value = settings.customSpeech[index] || '';
            
            document.getElementById('speechRate').value = settings.speechRate;
            document.getElementById('speechRateValue').textContent = settings.speechRate + 'x';
            
            document.getElementById('speechVolume').value = settings.speechVolume;
            document.getElementById('speechVolumeValue').textContent = Math.round(settings.speechVolume * 100) + '%';
        }

        // 更新图片大小
        function updateImageSize(value) {
            settings.imageSize = parseInt(value);
            document.getElementById('imageSizeValue').textContent = value + 'px';
            
            // 实时更新所有图片
            document.querySelectorAll('.product-image').forEach(img => {
                img.style.maxWidth = value + 'px';
                img.style.maxHeight = value + 'px';
            });
        }

        // 预览新图片
        function previewNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    settings.customImages[currentEditIndex] = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // 更新语速
        function updateSpeechRate(value) {
            settings.speechRate = parseFloat(value);
            document.getElementById('speechRateValue').textContent = value + 'x';
        }

        // 更新音量
        function updateSpeechVolume(value) {
            settings.speechVolume = parseFloat(value);
            document.getElementById('speechVolumeValue').textContent = Math.round(value * 100) + '%';
        }

        // 更新文字大小
        function updateTextSize(value) {
            settings.textSize = parseInt(value);
            document.getElementById('textSizeValue').textContent = value + 'px';
            
            // 实时更新所有商品名称
            document.querySelectorAll('.product-name').forEach(el => {
                el.style.fontSize = value + 'px';
            });
        }

        // 更新商品名称
        function updateProductName(value) {
            settings.customNames[currentEditIndex] = value;
            
            const nameEl = document.getElementById('productName' + currentEditIndex);
            if (nameEl) {
                nameEl.textContent = value;
            }
            
            // 如果自定义语音为空，使用新名称作为语音
            const customSpeechVal = document.getElementById('customSpeech').value;
            settings.customSpeech[currentEditIndex] = customSpeechVal;
        }

        // 全屏功能
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'F11') { e.preventDefault(); toggleFullScreen(); }
        });

        // 初始化
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
